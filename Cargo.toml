[package]
name = "trug"
version = "0.1.0"
authors = ["John-John Tedro <udoprog@tedro.se>"]
edition = "2024"
description = "A trunk replacement for component bundling."
documentation = "https://docs.rs/trug"
readme = "README.md"
repository = "https://github.com/udoprog/trug"
license = "MIT OR Apache-2.0"
keywords = ["build", "sass", "trunk", "wasm"]
categories = ["development-tools", "wasm"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
base64 = "0.22.1"
cargo_metadata = "0.23.1"
clap = { version = "4.6.8", features = ["derive"] }
flate2 = "1.1.11"
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
globset = "0.4.16"
libc = "0.2.191"
notify = "8.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "stream"] }
sasso = "=0.21.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "fs", "macros", "signal", "sync", "time"] }
tokio-tungstenite = "0.29.0"
toml = "1.2.1"
zip = { version = "9.7.3", default-features = false, features = ["deflate-flate2"] }
